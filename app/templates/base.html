<!DOCTYPE html>
<html lang="en">
<head>
  <title>Sign to Text</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/boxicons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/interface.css') }}">
</head>
<body class="dark app-shell">
  <nav class="sidebar">
    <header>
      <div class="image-text">
        <span class="image brand-mark"><i class='bx bx-hand'></i></span>
        <div class="text logo-text">
          <span class="name">Sign to Text</span>
          <span class="profession">AI Recognition</span>
        </div>
      </div>
      <i class='bx bx-chevron-right toggle' aria-label="Toggle sidebar"></i>
    </header>

    <div class="menu-bar">
      <div class="menu">
        <ul class="menu-links">
          <li class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
            <a href="{{ url_for('index') }}">
              <i class='bx bx-message-square-dots icon'></i>
              <span class="text nav-text">Sign to Text</span>
            </a>
          </li>

          <li class="nav-link {% if request.endpoint == 'record_page' %}active{% endif %}">
            <a href="{{ url_for('record_page') }}">
              <i class='bx bx-video icon'></i>
              <span class="text nav-text">Record</span>
            </a>
          </li>

          <li class="nav-link">
            <a href="#" id="signToVoiceNav" role="button">
              <i class='bx bx-volume-full icon'></i>
              <span class="text nav-text">Sign to Voice</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="bottom-content">
        <div class="system-status"><span></span> System ready</div>
      </div>
    </div>
  </nav>

  <section class="home">
    <main class="app-content">
      {% block content %}{% endblock %}
    </main>
  </section>

  <div class="modal fade" id="voiceDevelopmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content development-modal">
        <button type="button" class="modal-close" data-bs-dismiss="modal" aria-label="Close">&times;</button>
        <div class="development-icon"><i class='bx bx-volume-full'></i></div>
        <h3>Sign to Voice</h3>
        <p>This feature is still under development process.</p>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Got it</button>
      </div>
    </div>
  </div>

  {% block extra_scripts %}
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
  {% endblock %}
</body>
</html>
