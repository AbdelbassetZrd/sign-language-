{% extends 'base.html' %}
{% block content %}
<div class="record-page">
    <header class="page-heading">
        <div>
            <span class="eyebrow">Dataset capture</span>
            <h1>Record a Sign</h1>
            <p>Capture a clear example for the recognition dataset.</p>
        </div>
    </header>

    <div id="alert-area"></div>
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card recognition-card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Camera</h5>
                </div>
                <div class="card-body">
                    <video id="preview" autoplay muted playsinline class="w-100 recording-preview"></video>
                    <div class="recognition-controls mt-3">
                        <button id="startRecordingBtn" class="btn btn-primary me-2">Start Recording</button>
                        <button id="stopRecordingBtn" class="btn btn-danger" disabled>Stop Recording</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card recognition-card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Recorded Video</h5>
                </div>
                <div class="card-body">
                    <video id="previewVideo" class="w-100" controls style="display: none;"></video>
                    <div class="mb-3 mt-3">
                        <label for="labelInput" class="form-label">Sign label</label>
                        <input type="text" id="labelInput" placeholder="Enter a word or phrase" class="form-control" />
                    </div>
                    <div id="progressContainer" style="display: none;">
                        <label for="progressBar" class="form-label">Processing progress</label>
                        <div class="progress"><div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="previewModal" tabindex="-1" aria-labelledby="previewModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="previewModalLabel">Recorded Preview & Segment Selection</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <video id="modalVideo" class="w-100 mb-3" controls></video>
                    <div class="row g-2 mb-3">
                        <div class="col"><label for="modalStartTime" class="form-label">Start Time (s)</label><input type="number" id="modalStartTime" class="form-control" step="0.1" min="0"></div>
                        <div class="col"><label for="modalEndTime" class="form-label">End Time (s)</label><input type="number" id="modalEndTime" class="form-control" step="0.1" min="0"></div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="modalMirrorSwitch" checked>
                        <label class="form-check-label" for="modalMirrorSwitch">Enable Mirror Augmentation</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="modalExtractBtn" type="button" class="btn btn-primary">Extract</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/recorder.js') }}"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
